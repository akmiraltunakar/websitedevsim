<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazılımcı Simülatörü - İndir</title>
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // iOS (iPhone / iPad / iPod) Tespiti
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                window.location.replace("https://apps.apple.com/app/id6794744024");
            } 
            // Android Tespiti
            else if (/android/i.test(ua)) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.akmir.devsim");
            }
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e17;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #141a29;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #1f293d;
        }
        h1 { font-size: 22px; margin-bottom: 8px; color: #00f2fe; }
        p { color: #8b9bb4; font-size: 14px; margin-bottom: 24px; }
        .btn {
            display: block;
            margin: 12px 0;
            padding: 14px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.2s;
        }
        .btn-ios { background: #1c1c1e; border: 1px solid #3a3a3c; }
        .btn-android { background: #01875f; }
        .btn:hover { transform: scale(1.03); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yazılımcı Simülatörü</h1>
        <p>Cihazınız için uygun mağazayı seçin:</p>
        <a class="btn btn-ios" href="https://apps.apple.com/app/id6794744024">🍏 App Store'dan İndir</a>
        <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.akmir.devsim">🤖 Google Play'den İndir</a>
    </div>
</body>
</html>
